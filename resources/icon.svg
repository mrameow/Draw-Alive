<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Draw Alive logo: a single doodle creature stepping off the page -->
  <rect width="512" height="512" rx="112" fill="#FFD23F"/>
  <g fill="none" stroke="#1E1B2E" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
    <!-- motion lines -->
    <path d="M62 236 H118"/>
    <path d="M44 290 H104"/>
    <path d="M70 344 H114"/>
    <!-- legs mid-stride -->
    <path d="M212 372 L192 424"/>
    <path d="M300 374 L326 420"/>
    <!-- antenna -->
    <path d="M256 150 Q244 98 278 78"/>
  </g>
  <circle cx="284" cy="74" r="17" fill="#FF6B6B" stroke="#1E1B2E" stroke-width="14"/>
  <!-- body: one hand-drawn blob -->
  <path d="M150 330 Q128 196 246 152 Q366 116 394 246 Q412 350 302 372 Q196 392 150 330 Z"
        fill="#FFFFFF" stroke="#1E1B2E" stroke-width="22" stroke-linejoin="round"/>
  <!-- face -->
  <circle cx="306" cy="238" r="36" fill="#FFFFFF" stroke="#1E1B2E" stroke-width="16"/>
  <circle cx="318" cy="242" r="15" fill="#1E1B2E"/>
  <path d="M286 304 Q314 326 344 300" fill="none" stroke="#1E1B2E" stroke-width="16" stroke-linecap="round"/>
  <circle cx="362" cy="282" r="13" fill="#FF6B6B"/>
</svg>
