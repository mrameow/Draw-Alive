name: Build & publish

# Every push to main:
#   1. tests the web app in a real browser
#   2. publishes the web app to GitHub Pages
#   3. builds the Windows installer + portable .exe (Electron)
#   4. builds the Android .apk (Capacitor)
#   5. puts the .exe and .apk files on the "latest" GitHub Release
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: ''
      - run: npm test

  pages:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4

  windows:
    needs: test
    runs-on: windows-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron-builder --win nsis portable --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Draw-Alive-Windows
          path: dist/*.exe
          if-no-files-found: error

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Create Android project
        run: |
          npx cap add android
          node scripts/prepare-android.js
          npx cap sync android
      - name: Build APK (Android SDK is preinstalled on GitHub's Ubuntu runners)
        working-directory: android
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk Draw-Alive.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Draw-Alive-Android
          path: Draw-Alive.apk
          if-no-files-found: error

  release:
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la out
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/*.exe out/*.apk \
            --target "$GITHUB_SHA" \
            --title "Draw Alive – latest build" \
            --notes "Automatic build of ${GITHUB_SHA::7}.

          **Windows:** download \`Draw-Alive-Setup-*.exe\` (installer) or \`Draw-Alive-Portable-*.exe\` (no install needed).
          **Android:** download \`Draw-Alive.apk\`, open it on your phone and allow installing from this source.
          **Web:** https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
